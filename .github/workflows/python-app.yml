name: Install Fluxel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  install-fluxel:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install Fluxel
      run: |
        python -m pip install --upgrade pip
        pip install fluxel
